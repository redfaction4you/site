# Reads the live site and checks the pages a visitor reads.
#
# The other workflow checks the source. This checks the pages: each server page
# lists its rotation and shows its live panel, /servers lands on one of them,
# every address retired on 25 September 2026 still redirects, and the front
# page names the three servers.
#
# Runs after a push, once the deploy has had time to land, and every six hours
# after that, because the rotations change without anybody pushing.
#
# Reads public pages only. No secrets, no database, nothing to leak.
name: vet-live

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Long enough for Vercel to have built and swapped the deployment. A run
      # against the previous build would be checking the wrong pages, which is
      # worse than not checking: it reports green on work that is not live yet.
      - name: Wait for the deploy
        if: github.event_name == 'push'
        run: sleep 180
      - name: Vet the live pages
        run: node scripts/vet-pages.mjs https://redfaction4you.com

      # Is the plumbing working, as opposed to the pages. /api/health answers
      # 503 when the nightly backup has been skipped or the database does not
      # answer. It used to watch the stats sync and the Discord announcements,
      # both retired on 25 September 2026.
      #
      # The body is printed on failure because "503" on its own sends whoever
      # reads this straight to the database to work out which of the two it is.
      - name: Check the backup and the database
        run: |
          body=$(curl -sS --max-time 30 -w '\n%{http_code}' https://redfaction4you.com/api/health)
          code=$(printf '%s' "$body" | tail -n1)
          printf '%s\n' "$body" | head -n-1
          if [ "$code" != "200" ]; then
            echo "::error::/api/health answered $code"
            exit 1
          fi
