# Reads the live site and checks it does not contradict itself.
#
# The other workflow checks the source. This checks the pages, which is a
# different question: every figure can come from a correct query and the page
# still be wrong, because the total was queried one way and the table under it
# another. That is exactly what shipped, and a person found it.
#
# Runs after a push, once the deploy has had time to land, and every six hours
# after that, because the archive changes without anybody pushing: the VPS syncs
# every fifteen minutes and the writing regenerates on its own. A page that was
# right at deploy can be wrong by dinner.
#
# Reads public pages only. No secrets, no database, nothing to leak.
name: vet-live

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Long enough for Vercel to have built and swapped the deployment. A run
      # against the previous build would be checking the wrong pages, which is
      # worse than not checking: it reports green on work that is not live yet.
      - name: Wait for the deploy
        if: github.event_name == 'push'
        run: sleep 180
      - name: Vet the live pages
        run: node scripts/vet-pages.mjs https://redfaction4you.com

      # Is the pipeline running, as opposed to the pages agreeing with
      # themselves. /api/health answers 503 when the sync has stopped, when the
      # backup has been skipped, or when something written has been waiting to
      # be announced for more than six hours.
      #
      # That last one is here because it happened and nothing noticed.
      # DISCORD_NEWS_WEBHOOK was set locally and never added to production, so
      # the site wrote every column and every opinion piece, queued them, posted
      # none, and reported itself perfectly healthy for five days. The person who
      # found it was the person wondering where the write-ups had gone.
      #
      # The body is printed on failure because "503" on its own sends whoever
      # reads this straight to the database to work out which of the three it is.
      - name: Check the pipeline is running
        run: |
          body=$(curl -sS --max-time 30 -w '\n%{http_code}' https://redfaction4you.com/api/health)
          code=$(printf '%s' "$body" | tail -n1)
          printf '%s\n' "$body" | head -n-1
          if [ "$code" != "200" ]; then
            echo "::error::/api/health answered $code"
            exit 1
          fi
