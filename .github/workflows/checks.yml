# Types, lint and tests on every push.
#
# It was added for a bug in the match archive, retired on 25 September 2026: a
# filter applied to nine queries and missed on the tenth, so a published page
# disagreed with itself. The same checks now guard the server pages, the
# rotations and the catalogue.
#
# No secrets and no database. Everything here runs on the source alone, which is
# what keeps it fast enough to be worth having on every push.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
